<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Stock Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<style>
  /* Layout: one centred column; summary cards, then tabs, then item cards grouped by category. */
  :root {
    /* Linden green theme; orange is kept only for Low warnings. */
    --bg: #f3f4e4;
    --card: #ffffff;
    --line: #e0e2c6;
    --line-strong: #c8cba2;
    --text: #262a17;
    --muted: #6a6e55;
    --accent: #6f7620;
    --accent-strong: #555b14;
    --accent-soft: #ecefc9;
    --tint: #f3f4e4;
    --tint-strong: #e6e8cb;
    --warn: #c2410c;
    --warn-soft: #fff1e6;
    --ok: #3d4129;
    --bad: #b42318;
    --bad-soft: #fef3f2;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(26, 31, 54, .05), 0 2px 8px rgba(26, 31, 54, .04);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 17px; line-height: 1.45; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 96px; display: flex; flex-direction: column; gap: 24px; }
  .num { font-variant-numeric: tabular-nums; }

  /* Buttons */
  .btn { border: 1px solid var(--line-strong); background: var(--card); border-radius: 8px; padding: 9px 16px; font-weight: 600; font-size: 16px; box-shadow: 0 1px 1px rgba(26, 31, 54, .04); }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .45; box-shadow: none; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted); padding-inline: 10px; }
  .btn-quiet:hover:not(:disabled) { color: var(--text); border-color: transparent; }

  /* Header */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  .top h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; }
  .top-sub { color: var(--muted); font-size: 15px; }
  .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Summary cards */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
  .sum-card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 2px; }
  .sum-card:hover { border-color: var(--line-strong); }
  .sum-card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .sum-label { font-size: 15px; font-weight: 600; color: var(--muted); }
  .sum-value { font-size: 42px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .sum-value.is-low { color: var(--warn); }
  .sum-note { font-size: 15px; color: var(--muted); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .tab { border: 0; background: none; padding: 12px 14px; font-weight: 600; font-size: 17px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--accent-strong); border-bottom-color: var(--accent); }
  .pill { font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .pill.is-zero { background: var(--tint-strong); color: var(--muted); }

  /* Category chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line-strong); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 15px; font-weight: 500; color: var(--ok); }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }

  /* Item cards */
  .group { display: flex; flex-direction: column; gap: 10px; }
  .group h2 { margin: 8px 0 0; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; display: grid; grid-template-columns: minmax(200px, 1fr) auto auto minmax(150px, auto); align-items: center; gap: 12px 28px; }
  .item.is-dirty { border-color: var(--accent); }
  .item-name { font-size: 19px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .item-unit { font-size: 15px; color: var(--muted); }
  .badge-low { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .ctl { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .ctl-label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--card); }
  .stepper button { border: 0; background: var(--tint); width: 40px; font-size: 22px; font-weight: 500; line-height: 1; color: var(--ok); }
  .stepper button:hover { background: var(--tint-strong); }
  .stepper input { border: 0; border-inline: 1px solid var(--line); width: 68px; text-align: center; font-size: 22px; font-weight: 600; padding: 7px 4px; background: var(--card); font-variant-numeric: tabular-nums; }
  .stepper.is-invalid { border-color: var(--bad); }
  .item-actions { display: flex; align-items: center; justify-content: flex-end; gap: 4px; flex-wrap: wrap; }
  .item-status { grid-column: 1 / -1; font-size: 15px; }
  .item-status.is-ok { color: var(--muted); }
  .item-status.is-error { color: var(--bad); }

  /* Order list */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; font-size: 21px; letter-spacing: -.01em; }
  .panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
  .order-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; padding: 14px 20px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .order-row:last-child { border-bottom: 0; }
  .order-name { font-size: 19px; font-weight: 600; }
  .order-cat { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .order-qty { font-size: 24px; font-weight: 700; text-align: right; white-space: nowrap; }
  .order-qty small { font-size: 15px; font-weight: 500; color: var(--muted); }
  .order-split { grid-column: 1 / -1; color: var(--muted); font-size: 15px; }
  .notice { padding: 12px 20px; background: var(--accent-soft); color: var(--accent-strong); font-size: 15px; font-weight: 500; border-bottom: 1px solid var(--line); }
  .empty { padding: 28px 20px; color: var(--muted); }
  .banner { background: var(--bad-soft); color: var(--bad); border: 1px solid #fecdca; border-radius: var(--radius); padding: 12px 16px; font-size: 15px; }

  /* Unsaved bar */
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--text); color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; font-weight: 500; z-index: 5; }
  .savebar .btn-quiet { color: #d3d6b8; }
  .savebar .btn-quiet:hover { color: #fff; }

  @media (max-width: 820px) {
    .item { grid-template-columns: 1fr 1fr; }
    .item-main { grid-column: 1 / -1; }
    .item-actions { grid-column: 1 / -1; justify-content: flex-start; }
  }
  @media (max-width: 420px) {
    .wrap { padding-inline: 16px; }
    .stepper button { width: 34px; }
    .stepper input { width: 54px; }
    .item { gap: 12px 16px; padding: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .tab, .chip, .sum-card, .item { transition: border-color .12s, background-color .12s, color .12s, box-shadow .12s; }
  }
</style>
</head>
<body>

<div class="wrap" id="view-app">
  <header class="top">
    <div>
      <h1>Café Stock Tracker</h1>
      <div class="top-sub" id="last-count">Loading stock…</div>
    </div>
    <div class="top-actions">
      <button class="btn" id="btn-refresh" type="button">Refresh</button>
      <button class="btn" id="btn-export" type="button" disabled>Export PDF</button>
    </div>
  </header>

  <div class="banner" id="load-error" role="alert" hidden></div>

  <section class="summary" id="summary" aria-label="Low items by outlet"></section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Outlets"></nav>

  <section id="panel" role="tabpanel"></section>
</div>

<div class="savebar" id="savebar" hidden>
  <span id="savebar-text"></span>
  <button class="btn btn-primary" id="btn-save-all" type="button">Save all changes</button>
  <button class="btn btn-quiet" id="btn-discard-all" type="button">Discard</button>
</div>

<script>
(() => {
  const SUPABASE_URL = 'https://jbludfmlgaymvebzhffw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_p3NF9J1_j4fZQuIjzOh6Fg_b885Dqag';
  const ORDER_TAB = '__order__';
  const MAX_QTY = 99999;

  const $ = (id) => document.getElementById(id);
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth: {persistSession: false, autoRefreshToken: false}});

  // ---- state ---------------------------------------------------------
  let rows = [];                 // latest count per outlet + item
  let byKey = new Map();         // "outlet|sku" -> row
  const edits = new Map();       // "outlet|sku" -> {qty, reorder} (NaN = not a valid number)
  const cardSync = new Map();    // "outlet|sku" -> function that refreshes that card
  const cardNote = new Map();    // "outlet|sku" -> {kind: 'ok'|'error', text}
  const saving = new Set();
  let activeTab = null;
  let activeCategory = 'All';

  // ---- helpers -------------------------------------------------------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else if (v !== false && v != null) el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const keyOf = (r) => r.outlet + '|' + r.sku;
  const valid = (v) => Number.isInteger(v) && v >= 0 && v <= MAX_QTY;
  const isDirty = (key) => edits.has(key);
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function fmtDay(iso) {
    const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'});
  }
  function plural(unit, n) {
    if (n === 1) return unit;
    return /(x|s|ch|sh)$/.test(unit) ? unit + 'es' : unit + 's';
  }
  /** The figures to use for a row: unsaved edits when valid, otherwise what is saved. */
  function eff(r) {
    const e = edits.get(keyOf(r));
    return {
      qty: e && valid(e.qty) ? e.qty : r.qty_on_hand,
      reorder: e && valid(e.reorder) ? e.reorder : r.reorder_level,
    };
  }
  const isLow = (r) => { const e = eff(r); return e.qty <= e.reorder; };
  const outlets = () => Array.from(new Set(rows.map((r) => r.outlet))).sort();

  // ---- data ----------------------------------------------------------
  async function load() {
    const btn = $('btn-refresh');
    btn.disabled = true;
    const {data, error} = await sb.from('stock_current')
      .select('outlet, sku, item_name, unit, category, qty_on_hand, reorder_level, counted_at')
      .order('outlet').order('category').order('item_name');
    btn.disabled = false;
    const banner = $('load-error');
    if (error) {
      banner.textContent = `Could not load stock from Supabase: ${error.message}`;
      banner.hidden = false;
      $('last-count').textContent = 'Stock not loaded';
      return;
    }
    banner.hidden = true;
    rows = data || [];
    byKey = new Map(rows.map((r) => [keyOf(r), r]));
    for (const key of Array.from(edits.keys())) if (!byKey.has(key)) edits.delete(key);
    const names = outlets();
    if (activeTab !== ORDER_TAB && !names.includes(activeTab)) activeTab = names[0] || ORDER_TAB;
    renderAll();
  }
  $('btn-refresh').addEventListener('click', load);

  /** Saved stock for all outlets as a PDF (unsaved edits are not included). */
  function buildPdf() {
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({unit: 'pt', format: 'a4'});
    const M = 40, pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
    const GREEN = [111, 118, 32], WARN = [194, 65, 12], INK = [38, 42, 23], MUTED = [106, 110, 85];
    const latest = rows.reduce((m, r) => (r.counted_at > m ? r.counted_at : m), '');

    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(...INK);
    doc.text('Café Stock Tracker', M, 54);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...MUTED);
    doc.text(`Exported ${fmtDay(today())}  |  Latest count ${fmtDay(latest)}  |  ${rows.length} stock lines`, M, 72);
    let y = 100;

    const heading = (title, note) => {
      if (y > pageH - 130) { doc.addPage(); y = 54; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...INK);
      doc.text(title, M, y);
      if (note) {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...MUTED);
        doc.text(note, pageW - M, y, {align: 'right'});
      }
      y += 10;
    };
    const table = (head, body, columnStyles, statusCol) => {
      doc.autoTable({
        startY: y, margin: {left: M, right: M}, head: [head], body, theme: 'grid',
        styles: {font: 'helvetica', fontSize: 9, cellPadding: 5, textColor: INK, lineColor: [224, 226, 198], lineWidth: 0.5},
        headStyles: {fillColor: GREEN, textColor: 255, fontStyle: 'bold'},
        alternateRowStyles: {fillColor: [247, 248, 236]},
        columnStyles,
        didParseCell: (d) => {
          if (d.section === 'head' && columnStyles[d.column.index] && columnStyles[d.column.index].halign) d.cell.styles.halign = columnStyles[d.column.index].halign;
          if (d.section === 'body' && d.column.index === statusCol && d.cell.raw === 'Low') { d.cell.styles.textColor = WARN; d.cell.styles.fontStyle = 'bold'; }
        },
      });
      y = doc.lastAutoTable.finalY + 30;
    };

    const right = {halign: 'right'};
    for (const name of outlets()) {
      const mine = rows.filter((r) => r.outlet === name)
        .sort((a, b) => a.category.localeCompare(b.category) || a.item_name.localeCompare(b.item_name));
      const low = mine.filter((r) => r.qty_on_hand <= r.reorder_level).length;
      heading(name, `${low} of ${mine.length} items low`);
      table(['Category', 'Item', 'Unit', 'On hand', 'Reorder level', 'Status', 'Shortfall'],
        mine.map((r) => [r.category, r.item_name, r.unit, String(r.qty_on_hand), String(r.reorder_level),
          r.qty_on_hand <= r.reorder_level ? 'Low' : 'OK', String(Math.max(0, r.reorder_level - r.qty_on_hand))]),
        {3: right, 4: right, 6: right}, 5);
    }

    const order = orderLines(true);
    heading('Order from suppliers', 'Units needed to bring every outlet back up to its reorder level');
    if (order.length) {
      table(['Category', 'Item', 'Order', 'Unit', 'By outlet'],
        order.map((l) => [l.category, l.name, String(l.total), plural(l.unit, l.total), l.split.map((x) => `${x.outlet} ${x.short}`).join(', ')]),
        {2: right}, -1);
    } else {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...MUTED);
      doc.text('Nothing to order. Every item is at or above its reorder level.', M, y + 8);
    }

    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...MUTED);
      doc.text(`Page ${i} of ${pages}`, pageW - M, pageH - 24, {align: 'right'});
    }
    return doc;
  }
  $('btn-export').addEventListener('click', () => {
    if (!rows.length) return;
    const btn = $('btn-export');
    const flash = (text) => { btn.textContent = text; setTimeout(() => { btn.textContent = 'Export PDF'; }, 2200); };
    if (!window.jspdf || !window.jspdf.jsPDF.API.autoTable) { flash('PDF tool not loaded'); return; }
    try {
      buildPdf().save(`cafe-stock-${today()}.pdf`);
      flash('Exported');
    } catch (err) {
      console.error(err);
      flash('Export failed');
    }
  });

  async function save(keys) {
    const list = keys.filter((k) => {
      const e = edits.get(k);
      return e && valid(e.qty) && valid(e.reorder) && !saving.has(k);
    });
    if (!list.length) return;
    const day = today();
    const payload = list.map((k) => {
      const r = byKey.get(k), e = edits.get(k);
      return {outlet: r.outlet, sku: r.sku, qty_on_hand: e.qty, reorder_level: e.reorder, counted_at: day};
    });
    list.forEach((k) => { saving.add(k); cardNote.delete(k); });
    syncCards(list);
    const {error} = await sb.from('stock_counts').upsert(payload, {onConflict: 'outlet,sku,counted_at'});
    list.forEach((k) => saving.delete(k));
    if (error) {
      const text = `Not saved: ${error.message}`;
      list.forEach((k) => cardNote.set(k, {kind: 'error', text}));
    } else {
      payload.forEach((p, i) => {
        const r = byKey.get(list[i]);
        r.qty_on_hand = p.qty_on_hand;
        r.reorder_level = p.reorder_level;
        r.counted_at = day;
        edits.delete(list[i]);
        cardNote.set(list[i], {kind: 'ok', text: `Saved to Supabase as the count for ${fmtDay(day)}.`});
      });
    }
    syncCards(list);
    updateChrome();
    if (activeTab === ORDER_TAB) renderPanel();
  }
  function syncCards(keys) { keys.forEach((k) => { const fn = cardSync.get(k); if (fn) fn(true); }); }

  // ---- rendering -----------------------------------------------------
  function renderAll() {
    renderSummary();
    renderTabs();
    renderPanel();
    updateChrome();
  }

  function renderSummary() {
    const box = $('summary');
    box.replaceChildren(...outlets().map((name) =>
      h('button', {class: 'sum-card', type: 'button', 'data-outlet': name, onclick: () => selectTab(name)},
        h('span', {class: 'sum-label'}, name),
        h('span', {class: 'sum-value num', 'data-role': 'value'}, '0'),
        h('span', {class: 'sum-note', 'data-role': 'note'}, ''))));
  }

  function renderTabs() {
    const nav = $('tabs');
    const tab = (id, label) => h('button', {class: 'tab', type: 'button', role: 'tab', 'data-tab': id, onclick: () => selectTab(id)},
      label, h('span', {class: 'pill num', 'data-role': 'pill'}, '0'));
    nav.replaceChildren(...outlets().map((name) => tab(name, name)), tab(ORDER_TAB, 'Order from suppliers'));
  }

  function selectTab(id) {
    activeTab = id;
    activeCategory = 'All';
    renderPanel();
    updateChrome();
  }

  /** Numbers and states that depend on the current figures; cheap to call after every edit. */
  function updateChrome() {
    const totalDate = rows.reduce((m, r) => (r.counted_at > m ? r.counted_at : m), '');
    $('btn-export').disabled = !rows.length;
    $('last-count').textContent = rows.length ? `Latest count ${fmtDay(totalDate)} · ${rows.length} stock lines` : 'No stock found';

    for (const name of outlets()) {
      const mine = rows.filter((r) => r.outlet === name);
      const low = mine.filter(isLow).length;
      const card = $('summary').querySelector(`[data-outlet="${CSS.escape(name)}"]`);
      if (card) {
        const v = card.querySelector('[data-role="value"]');
        v.textContent = String(low);
        v.classList.toggle('is-low', low > 0);
        card.querySelector('[data-role="note"]').textContent = `of ${mine.length} items low`;
        card.setAttribute('aria-current', String(activeTab === name));
      }
      const pill = $('tabs').querySelector(`[data-tab="${CSS.escape(name)}"] [data-role="pill"]`);
      if (pill) { pill.textContent = String(low); pill.classList.toggle('is-zero', low === 0); }
    }
    const orderPill = $('tabs').querySelector(`[data-tab="${ORDER_TAB}"] [data-role="pill"]`);
    if (orderPill) { const n = orderLines().length; orderPill.textContent = String(n); orderPill.classList.toggle('is-zero', n === 0); }
    for (const t of $('tabs').querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.tab === activeTab));

    const n = edits.size;
    $('savebar').hidden = n < 2;
    $('savebar-text').textContent = `${n} unsaved changes`;
    const savable = Array.from(edits.values()).some((e) => valid(e.qty) && valid(e.reorder));
    $('btn-save-all').disabled = !savable || saving.size > 0;
  }

  function renderPanel() {
    cardSync.clear();
    const panel = $('panel');
    if (activeTab === ORDER_TAB) { panel.replaceChildren(buildOrder()); return; }
    const mine = rows.filter((r) => r.outlet === activeTab);
    const cats = Array.from(new Set(mine.map((r) => r.category))).sort();
    if (activeCategory !== 'All' && !cats.includes(activeCategory)) activeCategory = 'All';
    const chips = h('div', {class: 'chips', role: 'group', 'aria-label': 'Category'},
      ['All', ...cats].map((c) => h('button', {
        class: 'chip', type: 'button', 'aria-pressed': String(c === activeCategory),
        onclick: () => { activeCategory = c; renderPanel(); },
      }, c === 'All' ? 'All categories' : c)));
    const shown = activeCategory === 'All' ? cats : [activeCategory];
    const groups = shown.map((c) => h('div', {class: 'group'},
      h('h2', {}, c),
      mine.filter((r) => r.category === c).map(buildCard)));
    panel.replaceChildren(h('div', {class: 'group', style: 'gap:18px'},
      chips, mine.length ? groups : h('div', {class: 'panel empty'}, 'No items for this outlet yet.')));
  }

  function buildCard(r) {
    const key = keyOf(r);
    const idBase = 'f-' + key.replace(/[^a-zA-Z0-9]+/g, '-');
    const badge = h('span', {class: 'badge-low'}, 'Low');
    const status = h('div', {class: 'item-status', role: 'status'});

    function current() {
      return edits.get(key) || {qty: r.qty_on_hand, reorder: r.reorder_level};
    }
    function set(field, value) {
      const next = {...current(), [field]: value};
      if (next.qty === r.qty_on_hand && next.reorder === r.reorder_level) edits.delete(key);
      else edits.set(key, next);
      cardNote.delete(key);
      sync(false);
      updateChrome();
    }
    function control(field, label, saved) {
      const input = h('input', {id: `${idBase}-${field}`, inputmode: 'numeric', autocomplete: 'off', 'aria-label': `${label} for ${r.item_name}`});
      const box = h('div', {class: 'stepper'});
      const step = (d) => {
        const cur = current()[field];
        const base = valid(cur) ? cur : saved();
        const v = Math.min(MAX_QTY, Math.max(0, base + d));
        input.value = String(v);
        set(field, v);
      };
      input.addEventListener('input', () => {
        const t = input.value.trim();
        set(field, /^\d+$/.test(t) ? Number(t) : NaN);
      });
      input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !saveBtn.disabled) save([key]); });
      box.append(
        h('button', {type: 'button', 'aria-label': `Decrease ${label.toLowerCase()} for ${r.item_name}`, onclick: () => step(-1)}, '−'),
        input,
        h('button', {type: 'button', 'aria-label': `Increase ${label.toLowerCase()} for ${r.item_name}`, onclick: () => step(1)}, '+'));
      return {input, box, el: h('div', {class: 'ctl'}, h('label', {class: 'ctl-label', for: input.id}, label), box)};
    }
    const qty = control('qty', 'On hand', () => r.qty_on_hand);
    const reorder = control('reorder', 'Reorder level', () => r.reorder_level);
    const saveBtn = h('button', {class: 'btn btn-primary', type: 'button', onclick: () => save([key])}, 'Save');
    const undoBtn = h('button', {class: 'btn btn-quiet', type: 'button', onclick: () => {
      edits.delete(key); cardNote.delete(key); sync(true); updateChrome();
    }}, 'Undo');

    const card = h('article', {class: 'item'},
      h('div', {class: 'item-main'},
        h('div', {class: 'item-name'}, r.item_name, badge),
        h('div', {class: 'item-unit'}, `Counted in ${plural(r.unit, 2)}`)),
      qty.el, reorder.el,
      h('div', {class: 'item-actions'}, undoBtn, saveBtn),
      status);

    /** Refresh this card. rewrite = also put the figures back into the inputs. */
    function sync(rewrite) {
      const cur = current();
      if (rewrite) {
        qty.input.value = valid(cur.qty) ? String(cur.qty) : '';
        reorder.input.value = valid(cur.reorder) ? String(cur.reorder) : '';
      }
      const okQty = valid(cur.qty), okRe = valid(cur.reorder);
      qty.box.classList.toggle('is-invalid', !okQty);
      reorder.box.classList.toggle('is-invalid', !okRe);
      const dirty = isDirty(key), busy = saving.has(key);
      badge.hidden = !isLow(r);
      card.classList.toggle('is-dirty', dirty);
      saveBtn.disabled = !dirty || !okQty || !okRe || busy;
      saveBtn.textContent = busy ? 'Saving…' : 'Save';
      undoBtn.hidden = !dirty || busy;
      qty.input.disabled = reorder.input.disabled = busy;
      const note = cardNote.get(key);
      if (!okQty || !okRe) { status.className = 'item-status is-error'; status.textContent = `Enter a whole number from 0 to ${MAX_QTY}.`; status.hidden = false; }
      else if (note) { status.className = 'item-status is-' + note.kind; status.textContent = note.text; status.hidden = false; }
      else { status.hidden = true; status.textContent = ''; }
    }
    cardSync.set(key, sync);
    sync(true);
    return card;
  }

  // ---- order list ----------------------------------------------------
  /** One line per item whose shortfall (reorder level − on hand, never below 0) summed over all outlets is above 0. */
  function orderLines(savedOnly) {
    const map = new Map();
    for (const r of rows) {
      const e = savedOnly ? {qty: r.qty_on_hand, reorder: r.reorder_level} : eff(r);
      const short = Math.max(0, e.reorder - e.qty);
      let line = map.get(r.sku);
      if (!line) { line = {sku: r.sku, name: r.item_name, unit: r.unit, category: r.category, total: 0, split: []}; map.set(r.sku, line); }
      line.total += short;
      if (short > 0) line.split.push({outlet: r.outlet, short});
    }
    return Array.from(map.values()).filter((l) => l.total > 0)
      .sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
  }
  function orderText(lines) {
    const head = `Order from suppliers — ${fmtDay(today())}`;
    if (!lines.length) return `${head}\nNothing to order.`;
    return [head, ...lines.map((l) =>
      `${l.name} — ${l.total} ${plural(l.unit, l.total)} (${l.split.map((s) => `${s.outlet} ${s.short}`).join(', ')})`)].join('\n');
  }
  function buildOrder() {
    const lines = orderLines();
    const copyBtn = h('button', {class: 'btn btn-primary', type: 'button'}, 'Copy list');
    copyBtn.addEventListener('click', async () => {
      const text = orderText(lines);
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; }
      catch (_) {
        const ta = h('textarea', {style: 'position:fixed;opacity:0'});
        ta.value = text; document.body.append(ta); ta.select();
        try { ok = document.execCommand('copy'); } catch (_e) { ok = false; }
        ta.remove();
      }
      copyBtn.textContent = ok ? 'Copied' : 'Copy failed';
      setTimeout(() => { copyBtn.textContent = 'Copy list'; }, 1800);
    });
    copyBtn.disabled = !lines.length;
    const unsaved = edits.size;
    return h('div', {class: 'panel'},
      h('div', {class: 'panel-head'},
        h('div', {},
          h('h2', {}, 'Order from suppliers'),
          h('p', {}, 'Units needed to bring every outlet back up to its reorder level.')),
        copyBtn),
      unsaved ? h('div', {class: 'notice'}, `Includes ${unsaved} unsaved ${unsaved === 1 ? 'change' : 'changes'}. Save to keep ${unsaved === 1 ? 'it' : 'them'}.`) : null,
      lines.length
        ? lines.map((l) => h('div', {class: 'order-row'},
            h('div', {}, h('div', {class: 'order-cat'}, l.category), h('div', {class: 'order-name'}, l.name)),
            h('div', {class: 'order-qty num'}, String(l.total), ' ', h('small', {}, plural(l.unit, l.total))),
            h('div', {class: 'order-split num'}, l.split.map((s) => `${s.outlet} ${s.short}`).join(' · '))))
        : h('div', {class: 'empty'}, 'Nothing to order. Every item is at or above its reorder level.'));
  }

  // ---- save bar ------------------------------------------------------
  $('btn-save-all').addEventListener('click', () => save(Array.from(edits.keys())));
  $('btn-discard-all').addEventListener('click', () => {
    const keys = Array.from(edits.keys());
    edits.clear();
    keys.forEach((k) => cardNote.delete(k));
    syncCards(keys);
    updateChrome();
    if (activeTab === ORDER_TAB) renderPanel();
  });
  window.addEventListener('beforeunload', (ev) => { if (edits.size) { ev.preventDefault(); ev.returnValue = ''; } });

  // ---- start ---------------------------------------------------------
  load();
})();
</script>
</body>
</html>
