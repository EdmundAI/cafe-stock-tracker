<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Café Stock Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<style>
  /* Layout: one centred column; summary cards, then tabs, then item cards grouped by category. */
  :root {
    /* Linden green theme; orange is kept only for Low warnings. */
    --bg: #f3f4e4;
    --card: #ffffff;
    --line: #e0e2c6;
    --line-strong: #c8cba2;
    --text: #262a17;
    --muted: #6a6e55;
    --accent: #6f7620;
    --accent-strong: #555b14;
    --accent-soft: #ecefc9;
    --tint: #f3f4e4;
    --tint-strong: #e6e8cb;
    --warn: #c2410c;
    --warn-soft: #fff1e6;
    --ok: #3d4129;
    --bad: #b42318;
    --bad-soft: #fef3f2;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(26, 31, 54, .05), 0 2px 8px rgba(26, 31, 54, .04);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 17px; line-height: 1.45; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 20px 96px; display: flex; flex-direction: column; gap: 24px; }
  .num { font-variant-numeric: tabular-nums; }

  /* Buttons */
  .btn { border: 1px solid var(--line-strong); background: var(--card); border-radius: 8px; padding: 9px 16px; font-weight: 600; font-size: 16px; box-shadow: 0 1px 1px rgba(26, 31, 54, .04); }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: .45; box-shadow: none; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
  .btn-quiet { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted); padding-inline: 10px; }
  .btn-quiet:hover:not(:disabled) { color: var(--text); border-color: transparent; }

  /* Header */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
  .top h1 { margin: 0; font-size: 30px; letter-spacing: -.02em; }
  .top-sub { color: var(--muted); font-size: 15px; }
  .top-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  /* Summary cards */
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
  .sum-card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 2px; }
  .sum-card:hover { border-color: var(--line-strong); }
  .sum-card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .sum-label { font-size: 15px; font-weight: 600; color: var(--muted); }
  .sum-value { font-size: 42px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
  .sum-value.is-low { color: var(--warn); }
  .sum-note { font-size: 15px; color: var(--muted); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .tab { border: 0; background: none; padding: 12px 14px; font-weight: 600; font-size: 17px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--accent-strong); border-bottom-color: var(--accent); }
  .pill { font-size: 13px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .pill.is-zero { background: var(--tint-strong); color: var(--muted); }

  /* Category chips */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line-strong); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 15px; font-weight: 500; color: var(--ok); }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #fff; }

  /* Item cards */
  .group { display: flex; flex-direction: column; gap: 10px; }
  .group h2 { margin: 8px 0 0; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 20px; display: grid; grid-template-columns: minmax(200px, 1fr) auto auto minmax(150px, auto); align-items: center; gap: 12px 28px; }
  .item.is-dirty { border-color: var(--accent); }
  .item-name { font-size: 19px; font-weight: 600; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .item-unit { font-size: 15px; color: var(--muted); }
  .badge-low { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 9px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
  .ctl { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .ctl-label { font-size: 13px; font-weight: 600; color: var(--muted); }
  .stepper { display: inline-flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; background: var(--card); }
  .stepper button { border: 0; background: var(--tint); width: 40px; font-size: 22px; font-weight: 500; line-height: 1; color: var(--ok); }
  .stepper button:hover { background: var(--tint-strong); }
  .stepper input { border: 0; border-inline: 1px solid var(--line); width: 68px; text-align: center; font-size: 22px; font-weight: 600; padding: 7px 4px; background: var(--card); font-variant-numeric: tabular-nums; }
  .stepper.is-invalid { border-color: var(--bad); }
  .item-actions { display: flex; align-items: center; justify-content: flex-end; gap: 4px; flex-wrap: wrap; }
  .item-status { grid-column: 1 / -1; font-size: 15px; }
  .item-status.is-ok { color: var(--muted); }
  .item-status.is-error { color: var(--bad); }

  /* Order list */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { margin: 0; font-size: 21px; letter-spacing: -.01em; }
  .panel-head p { margin: 2px 0 0; color: var(--muted); font-size: 15px; }
  .order-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 20px; padding: 14px 20px; border-bottom: 1px solid var(--line); align-items: baseline; }
  .order-row:last-child { border-bottom: 0; }
  .order-name { font-size: 19px; font-weight: 600; }
  .order-cat { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .order-qty { font-size: 24px; font-weight: 700; text-align: right; white-space: nowrap; }
  .order-qty small { font-size: 15px; font-weight: 500; color: var(--muted); }
  .order-split { grid-column: 1 / -1; color: var(--muted); font-size: 15px; }
  .notice { padding: 12px 20px; background: var(--accent-soft); color: var(--accent-strong); font-size: 15px; font-weight: 500; border-bottom: 1px solid var(--line); }
  .empty { padding: 28px 20px; color: var(--muted); }
  .banner { background: var(--bad-soft); color: var(--bad); border: 1px solid #fecdca; border-radius: var(--radius); padding: 12px 16px; font-size: 15px; }

  /* Unsaved bar */
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--text); color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: center; gap: 16px; flex-wrap: wrap; font-weight: 500; z-index: 5; }
  .savebar .btn-quiet { color: #d3d6b8; }
  .savebar .btn-quiet:hover { color: #fff; }

  @media (max-width: 820px) {
    .item { grid-template-columns: 1fr 1fr; }
    .item-main { grid-column: 1 / -1; }
    .item-actions { grid-column: 1 / -1; justify-content: flex-start; }
  }
  @media (max-width: 420px) {
    .wrap { padding-inline: 16px; }
    .stepper button { width: 34px; }
    .stepper input { width: 54px; }
    .item { gap: 12px 16px; padding: 16px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .tab, .chip, .sum-card, .item { transition: border-color .12s, background-color .12s, color .12s, box-shadow .12s; }
  }

  /* Sign in, forms, users */
  .signin { position: relative; z-index: 1; min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .signin-card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px; display: flex; flex-direction: column; gap: 18px; }
  .signin-card h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .signin-card h1 iconify-icon { color: var(--accent); }
  .signin-card p { margin: 0; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label { font-size: 15px; font-weight: 600; }
  .field input, .field select { border: 1px solid var(--line-strong); border-radius: 8px; padding: 11px 12px; background: var(--card); font: inherit; font-size: 17px; color: inherit; width: 100%; }
  .form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 16px; align-items: end; }
  .form-msg { grid-column: 1 / -1; font-size: 15px; color: var(--muted); }
  .form-msg.is-error { color: var(--bad); }
  .panel-body { padding: 18px 20px; }
  .panel-body + .panel-body { border-top: 1px solid var(--line); }
  .user-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .user-name { flex: 1 1 160px; display: inline-flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 600; }
  .user-name iconify-icon { color: var(--accent); }
  .user-date { color: var(--muted); font-size: 15px; }
  .who { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 15px; margin-right: 4px; }

  /* Icons (Iconify, Solar bold duotone) */
  iconify-icon { display: inline-block; width: 1em; height: 1em; font-size: 1.25em; flex: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .top h1 { display: flex; align-items: center; gap: 10px; }
  .top h1 iconify-icon { font-size: 1.2em; color: var(--accent); }
  .sum-label, .chip, .badge-low, .order-cat { display: inline-flex; align-items: center; gap: 6px; }
  .group h2 { display: flex; align-items: center; gap: 6px; }
  .sum-label iconify-icon, .group h2 iconify-icon, .order-cat iconify-icon { color: var(--accent); }
  .stepper button { display: grid; place-items: center; }
  .stepper button iconify-icon { font-size: 24px; color: var(--accent); }

  /* Motion layer: particles behind the page; the dragon and its sparks above it */
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
  .wrap { position: relative; z-index: 1; }
  #fx-top { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 29; pointer-events: none; }
  .dragon { position: fixed; left: 0; top: 0; width: 52px; height: 52px; margin: -26px 0 0 -26px; z-index: 30; pointer-events: none; will-change: transform; }
  .dragon svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 3px 3px rgba(38, 42, 23, .18)); }
  .dragon .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: flap .22s ease-in-out infinite alternate; }
  .dragon .flame { transform-box: fill-box; transform-origin: 0 50%; transform: scale(var(--fire, 0)); opacity: var(--fire, 0); }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.4); } }
  .item, .sum-card { will-change: transform; }
  @media (prefers-reduced-motion: reduce) { #fx, #fx-top, .dragon { display: none; } }
</style>
</head>
<body>

<canvas id="fx" aria-hidden="true"></canvas>
<canvas id="fx-top" aria-hidden="true"></canvas>
<div class="dragon" id="dragon" aria-hidden="true" hidden>
  <svg viewBox="0 0 80 80">
    <path d="M22 48 C11 52 7 44 6 36 L2 39 L5 28 L11 35 L8 36 C9 42 13 46 22 44 Z" fill="#c2410c"/>
    <rect x="27" y="54" width="6" height="10" rx="3" fill="#c2410c"/>
    <rect x="40" y="54" width="6" height="10" rx="3" fill="#c2410c"/>
    <ellipse cx="35" cy="46" rx="16" ry="13" fill="#e8590c"/>
    <ellipse cx="37" cy="51" rx="10" ry="7" fill="#ffd8a8"/>
    <g class="wing"><path d="M31 40 C23 20 41 14 47 22 C42 23 42 28 44 31 C39 30 37 34 39 39 Z" fill="#6f7620"/></g>
    <path d="M48 24 L46 14 L53 21 Z" fill="#7a2e0e"/>
    <circle cx="52" cy="31" r="9.5" fill="#e8590c"/>
    <ellipse cx="60" cy="35" rx="6.5" ry="4.8" fill="#e8590c"/>
    <circle cx="55" cy="29" r="2.8" fill="#fff"/>
    <circle cx="56" cy="29" r="1.5" fill="#262a17"/>
    <g class="flame">
      <path d="M66 35 C71 28 80 29 86 35 C80 41 71 42 66 35 Z" fill="#f59f00"/>
      <path d="M67 35 C70 32 75 32 79 35 C75 38 70 38 67 35 Z" fill="#fff3bf"/>
    </g>
  </svg>
</div>

<main class="signin" id="view-signin" hidden>
  <form class="signin-card" id="signin-form" novalidate>
    <div>
      <h1><iconify-icon icon="solar:cup-hot-bold-duotone" aria-hidden="true"></iconify-icon>Café Stock Tracker</h1>
      <p>Sign in to view and update stock.</p>
    </div>
    <div class="field">
      <label for="signin-user">Username</label>
      <input id="signin-user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="signin-pass">Password</label>
      <input id="signin-pass" name="password" type="password" autocomplete="current-password" required>
    </div>
    <div class="form-msg is-error" id="signin-error" role="alert" hidden></div>
    <button class="btn btn-primary" id="signin-submit" type="submit"><iconify-icon icon="solar:login-2-bold-duotone" aria-hidden="true"></iconify-icon><span data-label>Sign in</span></button>
  </form>
</main>

<div class="wrap" id="view-app" hidden>
  <header class="top">
    <div>
      <h1><iconify-icon icon="solar:cup-hot-bold-duotone" aria-hidden="true"></iconify-icon>Café Stock Tracker</h1>
      <div class="top-sub" id="last-count">Loading stock…</div>
    </div>
    <div class="top-actions">
      <button class="btn" id="btn-refresh" type="button"><iconify-icon icon="solar:refresh-bold-duotone" aria-hidden="true"></iconify-icon><span data-label>Refresh</span></button>
      <button class="btn" id="btn-export" type="button" disabled><iconify-icon icon="solar:file-download-bold-duotone" aria-hidden="true"></iconify-icon><span data-label>Export PDF</span></button>
      <span class="who" id="who"></span>
      <button class="btn btn-quiet" id="btn-signout" type="button"><iconify-icon icon="solar:logout-2-bold-duotone" aria-hidden="true"></iconify-icon><span data-label>Sign out</span></button>
    </div>
  </header>

  <div class="banner" id="load-error" role="alert" hidden></div>

  <section class="summary" id="summary" aria-label="Low items by outlet"></section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Outlets"></nav>

  <section id="panel" role="tabpanel"></section>
</div>

<div class="savebar" id="savebar" hidden>
  <span id="savebar-text"></span>
  <button class="btn btn-primary" id="btn-save-all" type="button"><iconify-icon icon="solar:diskette-bold-duotone" aria-hidden="true"></iconify-icon><span data-label>Save all changes</span></button>
  <button class="btn btn-quiet" id="btn-discard-all" type="button"><iconify-icon icon="solar:trash-bin-trash-bold-duotone" aria-hidden="true"></iconify-icon><span data-label>Discard</span></button>
</div>

<script>
(() => {
  const SUPABASE_URL = 'https://jbludfmlgaymvebzhffw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_p3NF9J1_j4fZQuIjzOh6Fg_b885Dqag';
  const ORDER_TAB = '__order__';
  const MAX_QTY = 99999;

  const $ = (id) => document.getElementById(id);
  const LOGIN_DOMAIN = 'actiontracker.app';     // usernames sign in as <username>@actiontracker.app
  const ACCOUNT_TAB = '__account__';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ---- state ---------------------------------------------------------
  let rows = [];                 // latest count per outlet + item
  let byKey = new Map();         // "outlet|sku" -> row
  const edits = new Map();       // "outlet|sku" -> {qty, reorder} (NaN = not a valid number)
  const cardSync = new Map();    // "outlet|sku" -> function that refreshes that card
  const cardNote = new Map();    // "outlet|sku" -> {kind: 'ok'|'error', text}
  const saving = new Set();
  let activeTab = null;
  let activeCategory = 'All';
  let me = null;                 // the signed-in user: {id, username, role}

  // ---- helpers -------------------------------------------------------
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, '');
      else if (v !== false && v != null) el.setAttribute(k, v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  /** A Solar bold duotone icon from Iconify. */
  const icon = (name) => h('iconify-icon', {icon: `solar:${name}-bold-duotone`, 'aria-hidden': 'true'});
  const label = (text) => h('span', {'data-label': ''}, text);
  const setLabel = (btn, text) => { btn.querySelector('[data-label]').textContent = text; };
  const CAT_ICONS = {'Milk': 'bottle', 'Coffee': 'cup-hot', 'Cups & packaging': 'cup-paper', 'Syrups & powders': 'test-tube', 'Bakery': 'donut'};
  const catIcon = (c) => CAT_ICONS[c] || 'box-minimalistic';
  const keyOf = (r) => r.outlet + '|' + r.sku;
  const valid = (v) => Number.isInteger(v) && v >= 0 && v <= MAX_QTY;
  const isDirty = (key) => edits.has(key);
  function today() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function fmtDay(iso) {
    const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'});
  }
  function plural(unit, n) {
    if (n === 1) return unit;
    return /(x|s|ch|sh)$/.test(unit) ? unit + 'es' : unit + 's';
  }
  /** The figures to use for a row: unsaved edits when valid, otherwise what is saved. */
  function eff(r) {
    const e = edits.get(keyOf(r));
    return {
      qty: e && valid(e.qty) ? e.qty : r.qty_on_hand,
      reorder: e && valid(e.reorder) ? e.reorder : r.reorder_level,
    };
  }
  const isLow = (r) => { const e = eff(r); return e.qty <= e.reorder; };
  const outlets = () => Array.from(new Set(rows.map((r) => r.outlet))).sort();

  // ---- data ----------------------------------------------------------
  async function load() {
    const btn = $('btn-refresh');
    btn.disabled = true;
    const {data, error} = await sb.from('stock_current')
      .select('outlet, sku, item_name, unit, category, qty_on_hand, reorder_level, counted_at')
      .order('outlet').order('category').order('item_name');
    btn.disabled = false;
    const banner = $('load-error');
    if (error) {
      banner.textContent = `Could not load stock from Supabase: ${error.message}`;
      banner.hidden = false;
      $('last-count').textContent = 'Stock not loaded';
      return;
    }
    banner.hidden = true;
    rows = data || [];
    byKey = new Map(rows.map((r) => [keyOf(r), r]));
    for (const key of Array.from(edits.keys())) if (!byKey.has(key)) edits.delete(key);
    const names = outlets();
    if (activeTab !== ORDER_TAB && activeTab !== ACCOUNT_TAB && !names.includes(activeTab)) activeTab = names[0] || ORDER_TAB;
    renderAll();
  }
  $('btn-refresh').addEventListener('click', load);

  /** Saved stock for all outlets as a PDF (unsaved edits are not included). */
  function buildPdf() {
    const {jsPDF} = window.jspdf;
    const doc = new jsPDF({unit: 'pt', format: 'a4'});
    const M = 40, pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
    const GREEN = [111, 118, 32], WARN = [194, 65, 12], INK = [38, 42, 23], MUTED = [106, 110, 85];
    const latest = rows.reduce((m, r) => (r.counted_at > m ? r.counted_at : m), '');

    doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(...INK);
    doc.text('Café Stock Tracker', M, 54);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...MUTED);
    doc.text(`Exported ${fmtDay(today())}  |  Latest count ${fmtDay(latest)}  |  ${rows.length} stock lines`, M, 72);
    let y = 100;

    const heading = (title, note) => {
      if (y > pageH - 130) { doc.addPage(); y = 54; }
      doc.setFont('helvetica', 'bold'); doc.setFontSize(13); doc.setTextColor(...INK);
      doc.text(title, M, y);
      if (note) {
        doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...MUTED);
        doc.text(note, pageW - M, y, {align: 'right'});
      }
      y += 10;
    };
    const table = (head, body, columnStyles, statusCol) => {
      doc.autoTable({
        startY: y, margin: {left: M, right: M}, head: [head], body, theme: 'grid',
        styles: {font: 'helvetica', fontSize: 9, cellPadding: 5, textColor: INK, lineColor: [224, 226, 198], lineWidth: 0.5},
        headStyles: {fillColor: GREEN, textColor: 255, fontStyle: 'bold'},
        alternateRowStyles: {fillColor: [247, 248, 236]},
        columnStyles,
        didParseCell: (d) => {
          if (d.section === 'head' && columnStyles[d.column.index] && columnStyles[d.column.index].halign) d.cell.styles.halign = columnStyles[d.column.index].halign;
          if (d.section === 'body' && d.column.index === statusCol && d.cell.raw === 'Low') { d.cell.styles.textColor = WARN; d.cell.styles.fontStyle = 'bold'; }
        },
      });
      y = doc.lastAutoTable.finalY + 30;
    };

    const right = {halign: 'right'};
    for (const name of outlets()) {
      const mine = rows.filter((r) => r.outlet === name)
        .sort((a, b) => a.category.localeCompare(b.category) || a.item_name.localeCompare(b.item_name));
      const low = mine.filter((r) => r.qty_on_hand <= r.reorder_level).length;
      heading(name, `${low} of ${mine.length} items low`);
      table(['Category', 'Item', 'Unit', 'On hand', 'Reorder level', 'Status', 'Shortfall'],
        mine.map((r) => [r.category, r.item_name, r.unit, String(r.qty_on_hand), String(r.reorder_level),
          r.qty_on_hand <= r.reorder_level ? 'Low' : 'OK', String(Math.max(0, r.reorder_level - r.qty_on_hand))]),
        {3: right, 4: right, 6: right}, 5);
    }

    const order = orderLines(true);
    heading('Order from suppliers', 'Units needed to bring every outlet back up to its reorder level');
    if (order.length) {
      table(['Category', 'Item', 'Order', 'Unit', 'By outlet'],
        order.map((l) => [l.category, l.name, String(l.total), plural(l.unit, l.total), l.split.map((x) => `${x.outlet} ${x.short}`).join(', ')]),
        {2: right}, -1);
    } else {
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...MUTED);
      doc.text('Nothing to order. Every item is at or above its reorder level.', M, y + 8);
    }

    const pages = doc.getNumberOfPages();
    for (let i = 1; i <= pages; i++) {
      doc.setPage(i);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...MUTED);
      doc.text(`Page ${i} of ${pages}`, pageW - M, pageH - 24, {align: 'right'});
    }
    return doc;
  }
  $('btn-export').addEventListener('click', () => {

    if (!window.jspdf || !window.jspdf.jsPDF.API.autoTable) { flash('PDF tool not loaded'); return; }
    try {

  async function save(keys) {
    const list = keys.filter((k) => {
      const e = edits.get(k);
      return e && valid(e.qty) && valid(e.reorder) && !saving.has(k);
    });
    if (!list.length) return;
    const day = today();
    const payload = list.map((k) => {
      const r = byKey.get(k), e = edits.get(k);
      return {outlet: r.outlet, sku: r.sku, qty_on_hand: e.qty, reorder_level: e.reorder, counted_at: day};
    });
    list.forEach((k) => { saving.add(k); cardNote.delete(k); });
    syncCards(list);
    const {error} = await sb.from('stock_counts').upsert(payload, {onConflict: 'outlet,sku,counted_at'});
    list.forEach((k) => saving.delete(k));
    if (error) {
      const text = `Not saved: ${error.message}`;
      list.forEach((k) => cardNote.set(k, {kind: 'error', text}));
    } else {
      payload.forEach((p, i) => {
        const r = byKey.get(list[i]);
        r.qty_on_hand = p.qty_on_hand;
        r.reorder_level = p.reorder_level;
        r.counted_at = day;
        edits.delete(list[i]);
        cardNote.set(list[i], {kind: 'ok', text: `Saved to Supabase as the count for ${fmtDay(day)}.`});
      });
    }
    syncCards(list);
    updateChrome();
    if (activeTab === ORDER_TAB) renderPanel();
  }
  function syncCards(keys) { keys.forEach((k) => { const fn = cardSync.get(k); if (fn) fn(true); }); }

  /** Numbers and states that depend on the current figures; cheap to call after every edit. */
  function updateChrome() {
    const totalDate = rows.reduce((m, r) => (r.counted_at > m ? r.counted_at : m), '');
    $('btn-export').disabled = !rows.length;
    $('last-count').textContent = rows.length ? `Latest count ${fmtDay(totalDate)} · ${rows.length} stock lines` : 'No stock found';

    for (const name of outlets()) {
      const mine = rows.filter((r) => r.outlet === name);
      const low = mine.filter(isLow).length;
      const card = $('summary').querySelector(`[data-outlet="${CSS.escape(name)}"]`);
      if (card) {
        const v = card.querySelector('[data-role="value"]');
        v.textContent = String(low);
        v.classList.toggle('is-low', low > 0);
        card.querySelector('[data-role="note"]').textContent = `of ${mine.length} items low`;
        card.setAttribute('aria-current', String(activeTab === name));

      const pill = $('tabs').querySelector(`[data-tab="${CSS.escape(name)}"] [data-role="pill"]`);

  function buildCard(r) {
    const key = keyOf(r);
    const idBase = 'f-' + key.replace(/[^a-zA-Z0-9]+/g, '-');
    const badge = h('span', {class: 'badge-low'}, icon('danger-triangle'), 'Low');
    const status = h('div', {class: 'item-status', role: 'status'});

    function current() {
      return edits.get(key) || {qty: r.qty_on_hand, reorder: r.reorder_level};
    }
    function set(field, value) {
      const next = {...current(), [field]: value};
      if (next.qty === r.qty_on_hand && next.reorder === r.reorder_level) edits.delete(key);
      else edits.set(key, next);
      cardNote.delete(key);
      sync(false);
      updateChrome();
    }
    function control(field, title, saved) {
      const input = h('input', {id: `${idBase}-${field}`, inputmode: 'numeric', autocomplete: 'off', 'aria-label': `${title} for ${r.item_name}`});
      const box = h('div', {class: 'stepper'});
      const step = (d) => {
        const cur = current()[field];
        const base = valid(cur) ? cur : saved();
        const v = Math.min(MAX_QTY, Math.max(0, base + d));
        input.value = String(v);
        set(field, v);
      };
      input.addEventListener('input', () => {
        const t = input.value.trim();
        set(field, /^\d+$/.test(t) ? Number(t) : NaN);
      });
      input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' && !saveBtn.disabled) save([key]); });
      box.append(
        h('button', {type: 'button', 'aria-label': `Decrease ${title.toLowerCase()} for ${r.item_name}`, onclick: () => step(-1)}, icon('minus-circle')),
        input,
        h('button', {type: 'button', 'aria-label': `Increase ${title.toLowerCase()} for ${r.item_name}`, onclick: () => step(1)}, icon('add-circle')));
      return {input, box, el: h('div', {class: 'ctl'}, h('label', {class: 'ctl-label', for: input.id}, title), box)};
    }
    const qty = control('qty', 'On hand', () => r.qty_on_hand);
    const reorder = control('reorder', 'Reorder level', () => r.reorder_level);
    const saveBtn = h('button', {class: 'btn btn-primary', type: 'button', onclick: () => save([key])}, icon('diskette'), label('Save'));
    const undoBtn = h('button', {class: 'btn btn-quiet', type: 'button', onclick: () => {
      edits.delete(key); cardNote.delete(key); sync(true); updateChrome();
    }}, icon('undo-left-round'), 'Undo');

    const card = h('article', {class: 'item'},
      h('div', {class: 'item-main'},
        h('div', {class: 'item-name'}, r.item_name, badge),
        h('div', {class: 'item-unit'}, `Counted in ${plural(r.unit, 2)}`)),
      qty.el, reorder.el,
      h('div', {class: 'item-actions'}, undoBtn, saveBtn),
      status);

    /** Refresh this card. rewrite = also put the figures back into the inputs. */
    function sync(rewrite) {
      const cur = current();
      if (rewrite) {
        qty.input.value = valid(cur.qty) ? String(cur.qty) : '';
        reorder.input.value = valid(cur.reorder) ? String(cur.reorder) : '';
      }
      const okQty = valid(cur.qty), okRe = valid(cur.reorder);
      qty.box.classList.toggle('is-invalid', !okQty);
      reorder.box.classList.toggle('is-invalid', !okRe);
      const dirty = isDirty(key), busy = saving.has(key);
      badge.hidden = !isLow(r);
      card.classList.toggle('is-dirty', dirty);
      saveBtn.disabled = !dirty || !okQty || !okRe || busy;
      setLabel(saveBtn, busy ? 'Saving…' : 'Save');
      undoBtn.hidden = !dirty || busy;
      qty.input.disabled = reorder.input.disabled = busy;
      const note = cardNote.get(key);
      if (!okQty || !okRe) { status.className = 'item-status is-error'; status.textContent = `Enter a whole number from 0 to ${MAX_QTY}.`; status.hidden = false; }
      else if (note) { status.className = 'item-status is-' + note.kind; status.textContent = note.text; status.hidden = false; }
      else { status.hidden = true; status.textContent = ''; }
    }
    cardSync.set(key, sync);
    sync(true);
    return card;
  }

  // ---- order list ----------------------------------------------------
  /** One line per item whose shortfall (reorder level − on hand, never below 0) summed over all outlets is above 0. */
  function orderLines(savedOnly) {
    const map = new Map();
    for (const r of rows) {
      const e = savedOnly ? {qty: r.qty_on_hand, reorder: r.reorder_level} : eff(r);
      const short = Math.max(0, e.reorder - e.qty);
      let line = map.get(r.sku);
      if (!line) { line = {sku: r.sku, name: r.item_name, unit: r.unit, category: r.category, total: 0, split: []}; map.set(r.sku, line); }
      line.total += short;
      if (short > 0) line.split.push({outlet: r.outlet, short});
    }
    return Array.from(map.values()).filter((l) => l.total > 0)
      .sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name));
  }

    const head = `Order from suppliers — ${fmtDay(today())}`;

      `${l.name} — ${l.total} ${plural(l.unit, l.total)} (${l.split.map((s) => `${s.outlet} ${s.short}`).join(', ')})`)].join('\n');
  }

    return h('div', {class: 'panel'},

  // ---- motion: particles, fire-breathing dragon, card wobble -------------
  (function motion() {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const canvas = $('fx'), ctx = canvas.getContext('2d'), fly = $('dragon');
    const top = $('fx-top'), ctx2 = top.getContext('2d');
    const COLORS = ['rgba(111,118,32,.20)', 'rgba(196,191,113,.40)', 'rgba(150,158,70,.26)', 'rgba(232,89,12,.14)'];
    const pointer = {x: 0, y: 0, seen: false};
    let W = 0, H = 0, parts = [];

    function spawn(anywhere) {
      return {
        x: Math.random() * W, y: anywhere ? Math.random() * H : H + 12,
        r: 1.5 + Math.random() * 4.5, vx: 0, vy: 0,
        rise: 6 + Math.random() * 16, sway: 8 + Math.random() * 18, phase: Math.random() * 6.283,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
      };
    }
    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      top.width = canvas.width; top.height = canvas.height;
      ctx2.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.max(18, Math.min(70, Math.round(W * H / 22000)));
      while (parts.length < n) parts.push(spawn(true));
      parts.length = n;
    }
    window.addEventListener('resize', resize);
    resize();

    // Cards tilt toward the pointer on a spring, so they overshoot and settle when it moves or leaves.
    const CARD = '.item, .sum-card';
    const springs = new Map();
    let hot = null;
    function spring(el) {
      let s = springs.get(el);
      if (!s) { s = {rx: 0, ry: 0, lift: 0, vrx: 0, vry: 0, vlift: 0, trx: 0, try_: 0, tlift: 0}; springs.set(el, s); }
      return s;
    }
    function release() {
      if (!hot) return;
      const s = spring(hot);
      s.trx = s.try_ = s.tlift = 0;
      hot = null;
    }
    document.addEventListener('pointermove', (ev) => {
      pointer.x = ev.clientX; pointer.y = ev.clientY; pointer.seen = true;
      if (ev.pointerType === 'touch') return;
      const el = ev.target instanceof Element ? ev.target.closest(CARD) : null;
      if (el !== hot) {
        release();
        hot = el;
        if (el) {                                   // a nudge on entry, in the direction of travel
          const s = spring(el);
          s.vrx += -(ev.movementY || 0) * 2.5;
          s.vry += (ev.movementX || 0) * 2.5;
        }
      }
      if (!el) return;
      const box = el.getBoundingClientRect();
      const nx = (ev.clientX - box.left) / box.width - 0.5, ny = (ev.clientY - box.top) / box.height - 0.5;
      const max = el.classList.contains('item') ? 2.4 : 7;   // wide cards need far less tilt
      const s = spring(el);
      s.trx = -ny * 2 * max; s.try_ = nx * 2 * max; s.tlift = -3;
    }, {passive: true});
    document.addEventListener('pointerdown', (ev) => {
      const el = ev.target instanceof Element ? ev.target.closest(CARD) : null;
      if (el && ev.pointerType !== 'touch') spring(el).vlift += 90;      // press makes the card dip and bounce
    }, {passive: true});
    document.documentElement.addEventListener('pointerleave', release);
    window.addEventListener('blur', release);

    const b = {x: W * 0.78, y: 120, vx: 0, vy: 0, face: -1, flip: -1, tilt: 0, fire: 0};
    const MOUTH = {x: 25, y: -3};          // the snout, in px from the dragon's centre when it faces right
    let sparks = [];
    fly.hidden = false;

    let last = performance.now(), t = 0;
    function frame(now) {
      const dt = Math.min(0.033, Math.max(0, (now - last) / 1000));
      last = now; t += dt;

      // particles: drift up with a sway, pushed aside by the pointer
      ctx.clearRect(0, 0, W, H);
      const damp = Math.exp(-4 * dt);
      for (let i = 0; i < parts.length; i++) {
        const p = parts[i];
        if (pointer.seen) {
          const dx = p.x - pointer.x, dy = p.y - pointer.y, d = Math.hypot(dx, dy);
          if (d < 130 && d > 0.01) { const f = (1 - d / 130) * 420; p.vx += dx / d * f * dt; p.vy += dy / d * f * dt; }
        }
        if (b.fire > 0.2) {
          const fx = b.x + b.face * 60, dx = p.x - fx, dy = p.y - b.y, d = Math.hypot(dx, dy);
          if (d < 110 && d > 0.01) { const f = (1 - d / 110) * 900 * b.fire; p.vx += (dx / d * 0.5 + b.face * 0.5) * f * dt; p.vy += dy / d * 0.5 * f * dt; }
        }
        p.vx *= damp; p.vy *= damp; p.phase += dt * 0.8;
        p.x += (p.vx + Math.cos(p.phase) * p.sway) * dt;
        p.y += (p.vy - p.rise) * dt;
        if (p.y < -12) parts[i] = spawn(false);
        else if (p.x < -12) p.x = W + 12;
        else if (p.x > W + 12) p.x = -12;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fillStyle = p.color; ctx.fill();
      }

      // dragon: a loose spring toward a bobbing point beside the pointer; it faces the way it flies
      let tx = pointer.seen ? pointer.x + 30 : W * 0.78, ty = pointer.seen ? pointer.y - 34 : 120;
      tx += Math.sin(t * 1.7) * 16 + Math.sin(t * 0.6) * 10;
      ty += Math.cos(t * 2.4) * 10 + Math.sin(t * 3.1) * 4;
      b.vx += ((tx - b.x) * 38 - b.vx * 7) * dt;
      b.vy += ((ty - b.y) * 38 - b.vy * 7) * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      const speed = Math.hypot(b.vx, b.vy);
      if (b.vx > 30) b.face = 1; else if (b.vx < -30) b.face = -1;
      const ease = Math.min(1, dt * 10);
      b.flip += (b.face - b.flip) * ease;
      b.tilt += (Math.max(-0.45, Math.min(0.45, b.vy / 500)) * b.face - b.tilt) * ease;
      b.fire += (Math.max(0, Math.min(1, (speed - 150) / 260)) - b.fire) * Math.min(1, dt * 7);
      fly.style.transform = `translate(${b.x.toFixed(1)}px, ${b.y.toFixed(1)}px) rotate(${b.tilt.toFixed(3)}rad) scaleX(${b.flip.toFixed(3)})`;
      fly.style.setProperty('--fire', b.fire.toFixed(2));

      // sparks from the snout while it breathes fire, drawn above the page
      if (b.fire > 0.25 && sparks.length < 90) {
        for (let n = 0; n < 2; n++) {
          const life = 0.3 + Math.random() * 0.35;
          sparks.push({
            x: b.x + MOUTH.x * b.face, y: b.y + MOUTH.y,
            vx: b.face * (130 + Math.random() * 130) + b.vx * 0.4, vy: (Math.random() - 0.5) * 90 + b.vy * 0.3,
            r: 1.5 + Math.random() * 2.5, life, age: 0,
          });
        }
      }
      ctx2.clearRect(0, 0, W, H);
      if (sparks.length) {
        sparks = sparks.filter((k) => (k.age += dt) < k.life);
        for (const k of sparks) {
          const u = k.age / k.life;
          k.vx *= Math.exp(-3 * dt); k.vy -= 60 * dt;
          k.x += k.vx * dt; k.y += k.vy * dt;
          ctx2.globalAlpha = 1 - u;
          ctx2.fillStyle = u < 0.3 ? '#fff3bf' : u < 0.65 ? '#f59f00' : '#e8590c';
          ctx2.beginPath(); ctx2.arc(k.x, k.y, k.r * (1 - u * 0.5), 0, 6.283); ctx2.fill();
        }
        ctx2.globalAlpha = 1;
      }

      // card springs (underdamped, so they wobble)
      for (const [el, s] of springs) {
        if (!el.isConnected) { springs.delete(el); if (hot === el) hot = null; continue; }
        s.vrx += (-190 * (s.rx - s.trx) - 9 * s.vrx) * dt;
        s.vry += (-190 * (s.ry - s.try_) - 9 * s.vry) * dt;
        s.vlift += (-190 * (s.lift - s.tlift) - 11 * s.vlift) * dt;
        s.rx += s.vrx * dt; s.ry += s.vry * dt; s.lift += s.vlift * dt;
        const resting = el !== hot && Math.abs(s.rx) + Math.abs(s.ry) + Math.abs(s.lift) < 0.02 && Math.abs(s.vrx) + Math.abs(s.vry) + Math.abs(s.vlift) < 0.2;
        if (resting) { el.style.transform = ''; springs.delete(el); continue; }
        el.style.transform = `perspective(900px) rotateX(${s.rx.toFixed(3)}deg) rotateY(${s.ry.toFixed(3)}deg) translateY(${s.lift.toFixed(2)}px)`;
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

  // ---- account and users ------------------------------------------------
  /** Everyone who can sign in (profiles are readable by signed-in users). */
  async function listUsers() {
    const {data, error} = await sb.from('profiles').select('id, username, role, created_at').order('username');
    return error ? {error: error.message} : {data: {users: data || []}};
  }
  /** Adds a member through the database's admin_create_user function, which only admins may call. */
  async function createUser(username, password) {
    const {error} = await sb.rpc('admin_create_user', {p_username: username, p_password: password});
    return error ? {error: error.message} : {data: {}};
  }
  function field(id, text, attrs) {
    const input = h('input', {id, ...attrs});
    return {input, el: h('div', {class: 'field'}, h('label', {for: id}, text), input)};
  }
  function messenger() {
    const el = h('div', {class: 'form-msg', role: 'status', hidden: true});
    return {el, say: (text, bad) => { el.textContent = text; el.className = 'form-msg' + (bad ? ' is-error' : ''); el.hidden = false; }};
  }

  function buildAccount() {
    const wrap = h('div', {class: 'group', style: 'gap:18px'});
    const isAdmin = me.role === 'admin';

    // your own password
    const pw1 = field('pw-new', 'New password', {type: 'password', autocomplete: 'new-password'});
    const pw2 = field('pw-again', 'Repeat new password', {type: 'password', autocomplete: 'new-password'});
    const pwMsg = messenger();
    const pwBtn = h('button', {class: 'btn btn-primary', type: 'submit'}, icon('key'), label('Change password'));
    const pwForm = h('form', {class: 'form', novalidate: true, onsubmit: async (ev) => {
      ev.preventDefault();
      const a = pw1.input.value;
      if (a.length < 8) { pwMsg.say('Use at least 8 characters.', true); return; }
      if (a !== pw2.input.value) { pwMsg.say('The two passwords do not match.', true); return; }
      pwBtn.disabled = true;
      const {error} = await sb.auth.updateUser({password: a});
      pwBtn.disabled = false;
      if (error) { pwMsg.say(`Password not changed: ${error.message}`, true); return; }
      pw1.input.value = pw2.input.value = '';
      pwMsg.say('Password changed.');
    }}, pw1.el, pw2.el, h('div', {}, pwBtn), pwMsg.el);
    wrap.append(h('div', {class: 'panel'},
      h('div', {class: 'panel-head'}, h('div', {},
        h('h2', {}, 'Your account'),
        h('p', {}, `Signed in as ${me.username}, ${isAdmin ? 'an admin' : 'a member'}.`))),
      h('div', {class: 'panel-body'}, pwForm)));
    if (!isAdmin) return wrap;

    // everyone who can sign in, and a form to add someone
    const list = h('div', {}, h('div', {class: 'empty'}, 'Loading users…'));
    async function refresh() {
      const res = await listUsers();
      if (res.error) { list.replaceChildren(h('div', {class: 'empty form-msg is-error'}, `Could not load users: ${res.error}`)); return; }
      const users = res.data.users || [];
      list.replaceChildren(...users.map((u) => h('div', {class: 'user-row'},
        h('div', {class: 'user-name'}, icon(u.role === 'admin' ? 'shield-user' : 'user'), u.username),
        h('span', {class: 'pill' + (u.role === 'admin' ? '' : ' is-zero')}, u.role === 'admin' ? 'Admin' : 'Member'),
        h('span', {class: 'user-date'}, u.created_at ? `Added ${fmtDay(u.created_at)}` : ''))));
    }
    const nu = field('nu-name', 'Username', {autocomplete: 'off', autocapitalize: 'none', spellcheck: 'false'});
    const np = field('nu-pass', 'Initial password', {type: 'text', autocomplete: 'off'});
    const addMsg = messenger();
    const addBtn = h('button', {class: 'btn btn-primary', type: 'submit'}, icon('user-plus'), label('Add user'));
    const addForm = h('form', {class: 'form', novalidate: true, onsubmit: async (ev) => {
      ev.preventDefault();
      const name = nu.input.value.trim().toLowerCase(), pass = np.input.value;
      if (!/^[a-z0-9._-]{2,30}$/.test(name)) { addMsg.say('Usernames are 2 to 30 characters: lowercase letters, numbers, dot, dash or underscore.', true); return; }
      if (pass.length < 8) { addMsg.say('The initial password needs at least 8 characters.', true); return; }
      addBtn.disabled = true;
      const res = await createUser(name, pass);
      addBtn.disabled = false;
      if (res.error) { addMsg.say(`User not added: ${res.error}`, true); return; }
      nu.input.value = np.input.value = '';
      addMsg.say(`${name} can now sign in with that password and change it under Account.`);
      refresh();
    }}, nu.el, np.el, h('div', {}, addBtn), addMsg.el);
    wrap.append(h('div', {class: 'panel'},
      h('div', {class: 'panel-head'}, h('div', {},
        h('h2', {}, 'Users'),
        h('p', {}, 'Everyone who can sign in. New users are added as members.'))),
      list,
      h('div', {class: 'panel-body'}, addForm)));
    refresh();
    return wrap;
  }

  // ---- sign in and out -------------------------------------------------
  function leave() {
    me = null;
    rows = []; byKey = new Map(); edits.clear(); cardNote.clear();
    $('view-app').hidden = true;
    $('savebar').hidden = true;
    $('view-signin').hidden = false;
  }
  async function enter(session) {
    if (me && me.id === session.user.id) return;
    me = {id: session.user.id, username: (session.user.email || '').split('@')[0], role: 'member'};
    $('signin-pass').value = '';
    $('view-signin').hidden = true;
    $('view-app').hidden = false;
    const {data} = await sb.from('profiles').select('username, role').eq('id', me.id).maybeSingle();
    if (!me || me.id !== session.user.id) return;          // signed out while this was loading
    if (data) { me.username = data.username || me.username; me.role = data.role || 'member'; }
    $('who').replaceChildren(icon(me.role === 'admin' ? 'shield-user' : 'user'), me.username);
    activeTab = null;
    load();
  }
  $('signin-form').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const user = $('signin-user').value.trim().toLowerCase(), pass = $('signin-pass').value;
    const err = $('signin-error');
    err.hidden = true;
    if (!user || !pass) { err.textContent = 'Enter your username and password.'; err.hidden = false; return; }
    const btn = $('signin-submit');
    btn.disabled = true; setLabel(btn, 'Signing in…');
    const {error} = await sb.auth.signInWithPassword({email: user.includes('@') ? user : `${user}@${LOGIN_DOMAIN}`, password: pass});
    btn.disabled = false; setLabel(btn, 'Sign in');
    if (error) {
      err.textContent = /invalid login/i.test(error.message) ? 'That username and password do not match.' : `Could not sign in: ${error.message}`;
      err.hidden = false;
    }
  });
  $('btn-signout').addEventListener('click', async () => {
    if (edits.size && !window.confirm('You have unsaved changes. Sign out and discard them?')) return;
    edits.clear();
    await sb.auth.signOut();
  });
  // Supabase calls this on sign-in, sign-out and token refresh; defer so it never re-enters the auth client.
  sb.auth.onAuthStateChange((_event, session) => { setTimeout(() => (session ? enter(session) : leave()), 0); });

  // ---- start ---------------------------------------------------------
  // Fetch the icon set first: icons created while their data is still loading can come out blank.
  const iconsReady = new Promise((resolve) => {
    const Icon = customElements.get('iconify-icon');
    if (!Icon || !Icon.loadIcons) { resolve(); return; }
    const names = ['cup-hot', 'refresh', 'file-download', 'shop', 'cart-large-2', 'copy', 'diskette', 'undo-left-round',
      'danger-triangle', 'add-circle', 'minus-circle', 'widget', 'trash-bin-trash', 'box-minimalistic',
      'login-2', 'logout-2', 'user', 'user-circle', 'users-group-rounded', 'user-plus', 'key', 'shield-user', ...Object.values(CAT_ICONS)];
    Icon.loadIcons(names.map((n) => `solar:${n}-bold-duotone`), (_loaded, _missing, pending) => { if (!pending.length) resolve(); });
    setTimeout(resolve, 2500);            // never hold the stock list back for long
  });
  iconsReady.then(() => sb.auth.getSession()).then(({data}) => (data.session ? enter(data.session) : leave()));
})();
</script>
</body>
</html>
